services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: axon
      POSTGRES_PASSWORD: axon_password
      POSTGRES_DB: axon
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axon -d axon"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://axon:axon_password@db:5432/axon
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: change_me_in_production
      JWT_REFRESH_SECRET: change_me_too_in_production
      RUN_SEED: "true"
    ports:
      - "3000:3000"
      - "4000:4000"

volumes:
  db_data:
